name: Build & Release Music Player

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
    - name: Install ninja-build
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract Version Name
      id: get_version
      run: |
        VERSION=$(grep 'versionName' app/build.gradle | head -1 | awk -F'"' '{print $2}')
        if [ -z "$VERSION" ]; then
          VERSION="5.1.1"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
        echo "Extracted version: $VERSION"

    - name: Configure Release Keystore
      if: env.RELEASE_KEYSTORE_BASE64 != ''
      run: |
        python3 -c "import base64, os; s = ''.join(os.environ['RELEASE_KEYSTORE_BASE64'].split()).strip('\'\"'); s += '=' * ((4 - len(s) % 4) % 4); open('musicplayer-release.jks', 'wb').write(base64.b64decode(s))"
        cat <<EOF > keystore.properties
        storeFile=../musicplayer-release.jks
        storePassword=$RELEASE_KEYSTORE_PASSWORD
        keyAlias=$RELEASE_KEY_ALIAS
        keyPassword=$RELEASE_KEY_PASSWORD
        EOF

    - name: Build Release APK
      if: env.RELEASE_KEYSTORE_BASE64 != ''
      run: ./gradlew assembleRelease

    - name: Build Debug APK (Fallback)
      if: env.RELEASE_KEYSTORE_BASE64 == ''
      run: ./gradlew assembleDebug

    - name: Prepare Release Artifacts
      if: env.RELEASE_KEYSTORE_BASE64 != ''
      run: |
        cp app/build/outputs/apk/release/app-release.apk "MusicPlayer-v${VERSION}.apk"

    - name: Upload Release APK Artifact
      if: env.RELEASE_KEYSTORE_BASE64 != ''
      uses: actions/upload-artifact@v4
      with:
        name: MusicPlayer-Release-v${{ env.VERSION }}
        path: MusicPlayer-v${{ env.VERSION }}.apk

    - name: Upload Debug APK Artifact
      if: env.RELEASE_KEYSTORE_BASE64 == ''
      uses: actions/upload-artifact@v4
      with:
        name: MusicPlayer-Debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create / Update GitHub Release
      if: env.RELEASE_KEYSTORE_BASE64 != ''
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Music Player ${{ env.TAG_NAME }}
        body: |
          ### Music Player ${{ env.TAG_NAME }} Release
          - Automated release build generated from commit `${{ github.sha }}`.
          - Package: `com.HrshD1eux.musicplayer`
          - Version: `${{ env.VERSION }}`
        files: |
          MusicPlayer-v${{ env.VERSION }}.apk
          app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
